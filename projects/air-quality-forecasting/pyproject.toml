[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "air-quality-forecasting"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "joblib>=1.4,<2",
    "numpy>=2,<2.5",
    "pandas>=2.2,<3",
    "psutil>=5.9,<8",
    "python-dotenv>=1.0,<2",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29,<8",
    "matplotlib>=3.9,<4",
    "nbconvert>=7.16,<8",
    "pytest>=8,<9",
    "seaborn>=0.13,<1",
]

[project.scripts]
air-quality-fetch = "air_quality_forecasting.fetch:main"
air-quality-train = "air_quality_forecasting.train:main"
air-quality-forecast = "air_quality_forecasting.inference:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
